version: "3.9"

services:
  # ───────────────────────────────────
  # Rails + Sidekiq + Yarn dev-server
  # ───────────────────────────────────
  app:
    # ★ build コンテキストは同じ。Dockerfile を AL2023 版に置換済み
    build:
      context: .
      dockerfile: Dockerfile
    # ★ Procfile.dev を使わない場合は `bundle exec rails s -b 0.0.0.0`
    command: >
      sh -c "
        rm -f tmp/pids/server.pid &&
        bundle exec rails db:prepare &&
        bin/dev"
    volumes:
      - .:/app
      - storage_volume:/app/storage 
    # ★ AL2023 上でも env はそのまま
    env_file:
      - .env
    environment:
      RAILS_ENV: development
      SECRET_KEY_BASE: changeme
      # Python サービス接続先（Docker 内部DNSで py を引ける）
      PY_HOST: py
      PY_PORT: "8000"
      # DATABASE_URL は config/database.yml を優先するなら不要
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      py:
        condition: service_healthy
    # ★ ヘルスチェック (任意) – Rails が応答するかを確認
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/up || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
  # ───────────────────────────────────
  # PostgreSQL 16
  # ───────────────────────────────────
  db:
    image: postgres:16-alpine        # 変更なし
    environment:
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB:       diy_cutting_dev
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  # ───────────────────────────────────
  # Python (FastAPI) – DXF/PDF 生成
  # ───────────────────────────────────
  py:
    build: ./python_service
    # 開発中だけ外部公開。本番では消して内部専用に
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python - <<'PY'\nimport urllib.request,sys\nu='http://localhost:8000/health'\ntry:\n  urllib.request.urlopen(u, timeout=2)\n  sys.exit(0)\nexcept Exception:\n  sys.exit(1)\nPY"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
    external: true
    name: b7921c7195273aa2439ae5e5918fe1ff8e698e073cb9d2ff0aa568a808d5c291
  storage_volume: